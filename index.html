<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9b93a">
<title>Bot Client Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed navy header with gold rule, then one centred column: status line, summary tiles, toolbar, search and filters, responsive grid of client cards. Forms open as bottom sheets. */
:root{
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --bg:#0a0c12;
  --surface:#13161f;
  --surface-2:#1a1e2a;
  --field:#0d1017;
  --line:#2b303f;
  --line-soft:#1f2330;
  --fg:#f3f1ea;
  --muted:#a29fa0;

  --gold:#e6bb4e;
  --gold-hi:#f8dc8e;
  --gold-lo:#b6862a;
  --gold-text:#f0c65c;
  --gold-soft:rgba(230,187,78,.22);
  --on-gold:#1b1403;
  --gold-grad:linear-gradient(135deg,var(--gold-hi),var(--gold) 52%,var(--gold-lo));

  --ok:#3ed3a0;  --ok-bg:rgba(62,211,160,.14);
  --warn:#ff9a45; --warn-bg:rgba(255,154,69,.16);
  --bad:#ff7070;  --bad-bg:rgba(255,112,112,.16);

  --head-1:#f6d77f; --head-2:#dba92e; --head-fg:#15183a; --head-muted:#54410d;
  --glow-a:rgba(230,187,78,.08); --glow-b:rgba(120,110,150,.08);
  --shadow:0 12px 32px rgba(0,0,0,.38);
  --scrim:rgba(3,6,16,.72);

  --av0-bg:#26324f; --av0-fg:#c3d0f0;
  --av1-bg:#5a4513; --av1-fg:#ffe29a;
  --av2-bg:#14524a; --av2-fg:#9ef0d6;
  --av3-bg:#4a2a6e; --av3-fg:#e0c6ff;
  --av4-bg:#6a2c3d; --av4-fg:#ffc3d1;
  --tg0-bg:rgba(230,187,78,.18); --tg0-fg:#f0c65c;
  --tg1-bg:rgba(62,211,160,.16); --tg1-fg:#6fe3bd;
  --tg2-bg:rgba(167,139,250,.18); --tg2-fg:#c4b5fd;
  --tg3-bg:rgba(251,113,133,.18); --tg3-fg:#fda4af;
  --tg4-bg:rgba(96,165,250,.18); --tg4-fg:#93c5fd;
  --tg5-bg:rgba(251,146,60,.18); --tg5-fg:#fdba74;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf0f9; --surface:#ffffff; --surface-2:#e5eafa; --field:#f5f7fd; --line:#cdd5ec; --line-soft:#e0e5f4;
    --fg:#0b1535; --muted:#52608a;
    --gold:#c8962a; --gold-hi:#f2d27a; --gold-lo:#a47615; --gold-text:#85590a; --gold-soft:rgba(200,150,42,.26);
    --ok:#0c8a62; --ok-bg:rgba(12,138,98,.12); --warn:#b45309; --warn-bg:rgba(180,83,9,.12); --bad:#c23232; --bad-bg:rgba(194,50,50,.10);
    --glow-a:rgba(200,150,42,.12); --glow-b:rgba(70,104,230,.12);
    --shadow:0 10px 26px rgba(12,22,60,.12); --scrim:rgba(10,16,40,.5);
    --av0-bg:#d6e3ff; --av0-fg:#1d3b78; --av1-bg:#fbe9b8; --av1-fg:#6b4a05; --av2-bg:#cdf3e5; --av2-fg:#0f5a49;
    --av3-bg:#eadcff; --av3-fg:#4a2a6e; --av4-bg:#ffd9e2; --av4-fg:#7a2742;
    --tg0-bg:rgba(200,150,42,.18); --tg0-fg:#85590a; --tg1-bg:rgba(12,138,98,.14); --tg1-fg:#0b7a58;
    --tg2-bg:rgba(109,79,209,.13); --tg2-fg:#6d4fd1; --tg3-bg:rgba(190,58,85,.12); --tg3-fg:#be3a55;
    --tg4-bg:rgba(29,95,184,.12); --tg4-fg:#1d5fb8; --tg5-bg:rgba(180,84,10,.13); --tg5-fg:#b4540a;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf0f9; --surface:#ffffff; --surface-2:#e5eafa; --field:#f5f7fd; --line:#cdd5ec; --line-soft:#e0e5f4;
  --fg:#0b1535; --muted:#52608a;
  --gold:#c8962a; --gold-hi:#f2d27a; --gold-lo:#a47615; --gold-text:#85590a; --gold-soft:rgba(200,150,42,.26);
  --ok:#0c8a62; --ok-bg:rgba(12,138,98,.12); --warn:#b45309; --warn-bg:rgba(180,83,9,.12); --bad:#c23232; --bad-bg:rgba(194,50,50,.10);
  --glow-a:rgba(200,150,42,.12); --glow-b:rgba(70,104,230,.12);
  --shadow:0 10px 26px rgba(12,22,60,.12); --scrim:rgba(10,16,40,.5);
  --av0-bg:#d6e3ff; --av0-fg:#1d3b78; --av1-bg:#fbe9b8; --av1-fg:#6b4a05; --av2-bg:#cdf3e5; --av2-fg:#0f5a49;
  --av3-bg:#eadcff; --av3-fg:#4a2a6e; --av4-bg:#ffd9e2; --av4-fg:#7a2742;
    --tg0-bg:rgba(200,150,42,.18); --tg0-fg:#85590a; --tg1-bg:rgba(12,138,98,.14); --tg1-fg:#0b7a58;
    --tg2-bg:rgba(109,79,209,.13); --tg2-fg:#6d4fd1; --tg3-bg:rgba(190,58,85,.12); --tg3-fg:#be3a55;
    --tg4-bg:rgba(29,95,184,.12); --tg4-fg:#1d5fb8; --tg5-bg:rgba(180,84,10,.13); --tg5-fg:#b4540a;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font:400 15px/1.5 var(--font-body);
  min-height:100%;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-1);z-index:30}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 40% at 90% 0%,var(--glow-a),transparent 70%),
    radial-gradient(70% 50% at 0% 12%,var(--glow-b),transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{
  width:100%;max-width:1080px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- header ---------- */
.site-head{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:linear-gradient(180deg,var(--head-1),var(--head-2));
  color:var(--head-fg);
  overflow:hidden;
  box-shadow:0 8px 24px rgba(120,80,0,.28);
}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 13px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{
  flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#222c64,#0b1030);
  display:grid;place-items:center;color:var(--gold-hi);
  box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 6px 16px rgba(21,24,58,.35);
  animation:glow 4.5s ease-in-out infinite;position:relative;overflow:hidden;
}
.crest::after{content:"";position:absolute;inset:-40% auto -40% -60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:glint 5.5s ease-in-out infinite}
.crest svg{width:26px;height:26px;position:relative;z-index:1}
.brand-text{min-width:0}
h1{
  margin:0;font:700 clamp(17px,5vw,28px)/1.15 var(--font-display);letter-spacing:.03em;color:var(--head-fg);
}
@supports (-webkit-background-clip:text) or (background-clip:text){
  h1{
    background:linear-gradient(100deg,var(--head-fg) 0%,var(--head-fg) 38%,#fff9e0 50%,var(--head-fg) 62%,var(--head-fg) 100%);
    background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:shine 8s linear infinite;
  }
}
.brand-text p{margin:3px 0 0;font-size:12.5px;color:var(--head-muted);letter-spacing:.02em}
.gold-rule{height:3px;background:linear-gradient(90deg,transparent,#8a6410,#15183a,#8a6410,transparent);position:relative;overflow:hidden}
.gold-rule::after{content:"";position:absolute;inset:0 auto 0 -30%;width:30%;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.75;animation:rule 6s ease-in-out infinite}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;bottom:-4px;left:var(--x);width:3px;height:3px;border-radius:50%;background:#fffbe8;opacity:0;animation:float var(--t,9s) linear var(--d,0s) infinite}
.theme{
  flex:none;display:flex;padding:3px;border-radius:999px;background:rgba(21,24,58,.10);border:1px solid rgba(21,24,58,.28);
}
.theme button{
  display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;
  color:var(--head-muted);font-weight:500;font-size:13px;transition:background .25s,color .25s,transform .2s;
}
.theme button svg{width:16px;height:16px}
.theme button[aria-pressed="true"]{background:#15183a;color:var(--gold-hi);font-weight:600}
.theme button:active{transform:scale(.95)}
@media (max-width:520px){.theme button span{display:none}.theme button{padding:0 11px}}

/* ---------- main ---------- */
main{padding-block:18px calc(40px + env(safe-area-inset-bottom,0px))}
.status-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.gold{background:var(--gold)}
.chip .dot.live{animation:pulse 2.4s ease-in-out infinite}
.today{font-size:12.5px;color:var(--muted);font-family:var(--font-data)}

.banner{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;margin-bottom:14px;border-radius:16px;
  background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--fg);
}
.banner p{margin:0;flex:1 1 220px;min-width:0}
.banner.info{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.banner b{font-weight:600}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{
  background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0;
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.tile:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:var(--shadow)}
.num{font:700 clamp(26px,7vw,34px)/1.1 var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num.gold{color:var(--gold-text)}.num.warn{color:var(--warn)}.num.bad{color:var(--bad)}
.lab{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub{margin-top:3px;font-size:12px;color:var(--muted);font-family:var(--font-data)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:14.5px;
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.gold{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;box-shadow:0 8px 22px var(--gold-soft)}
.btn.gold::after{content:"";position:absolute;inset:-30% auto -30% -70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:glint 5s ease-in-out 1.2s infinite}
.btn.sm{min-height:40px;padding:0 13px;font-size:13.5px;border-radius:12px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.warnbtn{background:transparent}
.btn:disabled{opacity:.55;cursor:default;transform:none}

.finder{display:grid;gap:10px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
input[type=search]{padding-left:42px}
.field-in,input[type=search],input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font-size:16px;
  transition:border-color .2s,box-shadow .2s;
}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{
  min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s;
}
.fchip small{font-family:var(--font-data);font-size:11.5px;color:var(--muted)}
.fchip:hover{border-color:var(--gold)}
.fchip[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;font-weight:600}
.fchip[aria-pressed="true"] small{color:var(--on-gold);opacity:.75}
.selectbox{position:relative;max-width:260px}
.selectbox select{appearance:none;-webkit-appearance:none;padding-right:40px;font-size:15px}
.selectbox::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}

.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.list-head h2{margin:0;font:600 17px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text)}
.lh-r{display:flex;align-items:center;gap:10px}
.lh-r span{font-size:12.5px;color:var(--muted);font-family:var(--font-data)}

.tagbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tagbar .fchip{flex:none}
.fchip.sm{min-height:36px;padding:0 13px;font-size:13.5px}
.fchip.ghost{border-style:dashed;color:var(--muted)}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.sortrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sortrow .selectbox{flex:1 1 200px}
.tagchip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.tc0{background:var(--tg0-bg);color:var(--tg0-fg)}.tc1{background:var(--tg1-bg);color:var(--tg1-fg)}.tc2{background:var(--tg2-bg);color:var(--tg2-fg)}
.tc3{background:var(--tg3-bg);color:var(--tg3-fg)}.tc4{background:var(--tg4-bg);color:var(--tg4-fg)}.tc5{background:var(--tg5-bg);color:var(--tg5-fg)}
.tcn{background:var(--line-soft);color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.group-head{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px}
.group-head:first-child{margin-top:0}
.group-head .n{font:500 12.5px var(--font-data);color:var(--muted)}
.group-head::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.card{
  min-width:0;background:linear-gradient(165deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:12px;transition:transform .25s,box-shadow .25s,border-color .25s;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.soon{border-color:color-mix(in srgb,var(--warn) 65%,var(--line))}
.card.expired{border-color:color-mix(in srgb,var(--bad) 70%,var(--line))}
.card.picked{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.card.enter{animation:rise .55s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.card.flash{animation:flash 1.4s ease-out}
.card.leaving{animation:leave .22s ease-in forwards}
.c-top{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:14px;margin:-4px;padding:4px;-webkit-tap-highlight-color:transparent}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 18px/1 var(--font-display)}
.av0{background:var(--av0-bg);color:var(--av0-fg)}.av1{background:var(--av1-bg);color:var(--av1-fg)}.av2{background:var(--av2-bg);color:var(--av2-fg)}
.av3{background:var(--av3-bg);color:var(--av3-fg)}.av4{background:var(--av4-bg);color:var(--av4-fg)}
.who{flex:1;min-width:0}
.who h3{margin:0;font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.who p{margin:3px 0 0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chev{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.chev svg{transition:transform .35s cubic-bezier(.2,.75,.2,1)}
.chev .ch{display:none}
.card.open .chev .cs{display:none}.card.open .chev .ch{display:inline}
.card.open .chev svg{transform:rotate(180deg)}
.pick{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,color .2s,transform .2s}
.card.picked .pick{background:var(--gold-grad);border-color:transparent;color:var(--on-gold);transform:scale(1.06)}
.stat-line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.exp{font-size:13.5px;color:var(--muted)}
.exp b{color:var(--fg);font-family:var(--font-data);font-weight:700;font-size:14px}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.active{background:var(--ok-bg);color:var(--ok)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}.pill.soon i{animation:pulse 1.6s ease-in-out infinite}
.pill.expired{background:var(--bad-bg);color:var(--bad)}
.bar{height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,100%);border-radius:inherit;transform-origin:left;animation:grow .9s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + .15s)}
.card.active .bar i{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 55%,var(--gold-hi)))}
.card.soon .bar i{background:linear-gradient(90deg,var(--warn),var(--gold))}
.card.expired .bar i{background:var(--bad)}
.renew{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.renew>span:first-child{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px;font-weight:500}
.renew .rate{margin-left:auto;font-family:var(--font-data);font-size:12.5px;color:var(--muted)}
.mini{
  min-height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-data);font-weight:700;font-size:12.5px;
  transition:transform .15s,border-color .2s,background .2s;
}
.mini:hover{border-color:var(--gold)}.mini:active{transform:scale(.92)}
.mini.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.details{display:grid;grid-template-rows:0fr;margin-top:-12px;visibility:hidden;transition:grid-template-rows .38s cubic-bezier(.2,.75,.2,1),margin-top .38s cubic-bezier(.2,.75,.2,1),visibility 0s .38s}
.card.open .details{grid-template-rows:1fr;margin-top:0;visibility:visible;transition:grid-template-rows .38s cubic-bezier(.2,.75,.2,1),margin-top .38s cubic-bezier(.2,.75,.2,1),visibility 0s}
.inner{overflow:hidden;min-height:0;display:grid;gap:12px;padding:2px}
.creds{display:grid;gap:0;padding:2px 14px;border-radius:14px;background:var(--field);border:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k ra" "v ra";gap:2px 10px;align-items:center;padding:10px 0}
.row+.row{border-top:1px dashed var(--line-soft)}
.k{grid-area:k;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.v{grid-area:v;min-width:0;font-family:var(--font-data);font-size:13.5px;overflow-wrap:anywhere;user-select:all}
.ra{grid-area:ra;display:flex;gap:6px}
.note{font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--gold-soft);overflow-wrap:anywhere;color:var(--fg)}
.empty-creds{margin:0;font-size:13.5px;color:var(--muted)}
.more{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}

.empty{
  grid-column:1/-1;text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);
  display:grid;gap:12px;justify-items:center;
}
.empty h3{margin:0;font:600 18px/1.3 var(--font-display);letter-spacing:.05em;color:var(--fg)}
.empty p{margin:0;max-width:34ch}
.foot{margin:26px 0 0;font-size:13px;color:var(--muted);max-width:70ch}

/* ---------- sheets, toast ---------- */
body.lock{overflow:hidden}
.overlay{
  position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .22s ease-out;backdrop-filter:blur(3px);
}
.overlay.out{animation:fadeout .18s ease-in forwards}
.sheet{
  width:min(580px,100%);max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:sheetup .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.4);
}
.overlay.out .sheet{animation:sheetdown .18s ease-in forwards}
@media (min-width:700px){
  .overlay{align-items:center}
  .sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:min(88%,820px)}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{margin:0;font:700 20px/1.2 var(--font-display);letter-spacing:.05em;color:var(--gold-text)}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--field)}
.icon-btn svg{width:18px;height:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12.5px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.inline{display:flex;gap:8px}
.inline>*{min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.err{grid-column:1/-1;margin:0;padding:10px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-size:14px;font-weight:500}
.form-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding-top:4px}
.sheet h3.sec{margin:20px 0 8px;font:600 13px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p.txt{margin:0 0 12px;color:var(--muted);font-size:14px}
.toast{
  position:fixed;z-index:80;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:460px;
  display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:16px;
  background:var(--surface-2);border:1px solid var(--gold);box-shadow:var(--shadow);font-size:14.5px;animation:toastin .3s cubic-bezier(.2,.8,.2,1);
}
.toast span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast button{flex:none;min-height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--gold-grad);color:var(--on-gold);font-weight:700}
.toast.out{animation:toastout .2s ease-in forwards}
.selbar{
  position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface-2);border-top:1px solid var(--gold);box-shadow:0 -14px 34px rgba(0,0,0,.35);animation:sheetup .3s cubic-bezier(.2,.8,.2,1);
}
.selbar b{font-family:var(--font-data);font-size:14px}
.selbtns{display:flex;flex-wrap:wrap;gap:8px}
body.selecting main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body.selecting .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.optlist{display:grid;gap:8px}
.pickopt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:500;font-size:15px;text-align:left;transition:border-color .2s,transform .15s}
.pickopt:hover{border-color:var(--gold)}.pickopt:active{transform:scale(.98)}
.tagrow{display:flex;align-items:center;gap:8px;padding:5px 0}
.tagrow input{flex:1;min-width:0}
.tagrow small{flex:none;font-family:var(--font-data);font-size:12px;color:var(--muted);min-width:18px;text-align:right}
.swatch{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);display:grid;place-items:center}
.swatch i{width:18px;height:18px;border-radius:50%;display:block}
.fld>label.check{text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--fg);font-weight:500}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:.01;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes sheetup{from{transform:translateY(40px);opacity:.01}to{transform:none;opacity:1}}
@keyframes sheetdown{to{transform:translateY(40px);opacity:0}}
@keyframes toastin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateY(14px);opacity:0}}
@keyframes leave{to{opacity:0;transform:scale(.94) translateY(6px)}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--gold)}35%{box-shadow:0 0 0 6px var(--gold-soft),0 0 28px var(--gold-soft)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 6px 16px rgba(21,24,58,.30)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.28) inset,0 6px 24px rgba(21,24,58,.5)}}
@keyframes glint{0%,60%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes rule{0%,40%{transform:translateX(0)}100%{transform:translateX(480%)}}
@keyframes float{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-70px)}}
.head-in{animation:rise .6s cubic-bezier(.2,.75,.2,1) backwards}
.tile{animation:rise .6s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms + .1s)}
.toolbar,.finder,.status-row{animation:rise .6s cubic-bezier(.2,.75,.2,1) backwards;animation-delay:.35s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .sparks{display:none}
}

/* ---------- phone-first overrides ---------- */
input[type=search]{padding-left:44px}
.fab{display:none}
@media (hover:none){.tile:hover,.btn:hover,.card:hover{transform:none;box-shadow:none}}
@media (max-width:640px){

  .stats{gap:8px;margin-bottom:12px}
  .tile{padding:12px 14px;border-radius:16px}
  .num{font-size:26px}
  .lab{font-size:10.5px;margin-top:6px}
  .toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .toolbar .btn{flex-direction:column;gap:5px;min-height:62px;padding:8px 2px;font-size:12px;border-radius:14px}
  .toolbar .btn svg{width:22px;height:22px}
  .toolbar .btn.gold{display:none}
  .finder{gap:10px;margin-bottom:8px}
  input[type=search]{min-height:50px;border-radius:14px}
  .tagbar,.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-12px;padding-inline:12px}
  .tagbar::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
  .filters .fchip{flex:none}
  .sortrow{display:grid;grid-template-columns:1fr auto;gap:8px}
  .sortrow .selectbox{max-width:none;flex:none}
  .list-head{margin:14px 0 10px}
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .card{padding:14px;border-radius:20px;gap:14px}
  .avatar{width:50px;height:50px}
  .who h3{font-size:19px}

  .mini{min-height:48px;font-size:14px;border-radius:12px}

  .ra .icon-btn,.ra .btn,.ra button{min-width:44px;min-height:44px}

  .fab{
    position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
    display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:0 22px;border:0;border-radius:999px;
    background:var(--gold-grad);color:var(--on-gold);font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(0,0,0,.35),0 4px 14px var(--gold-soft);
  }
  .fab svg{width:22px;height:22px}

  body.lock .fab,body.selecting .fab{display:none}
  .sparks{display:none}
  .overlay .sheet{max-height:calc(100% - 12px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0}
  .form-actions .btn{flex:1 1 100%}

}
</style>

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=x=>{const n=Number(x);return isFinite(n)?n:0};
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return toISO(new Date())}
function parseISO(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d)}
function diffDays(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
function fmtDate(iso){if(!iso)return '';const d=parseISO(iso);return pad(d.getDate())+'-'+MONTHS[d.getMonth()]+'-'+d.getFullYear()}
function uid(p){return p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function money(n){return '₹'+Math.round(num(n)).toLocaleString('en-IN')}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function safeId(id,p){return (typeof id==='string'&&/^[A-Za-z0-9_-]{1,60}$/.test(id)&&id!=='settings')?id:uid(p)}

  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  plus:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'

/* ---------- tags ---------- */
const tags=()=>state.settings.tags;
function tagById(id){return tags().find(t=>t.id===id)||null}
function tagOf(c){if(c.tag!==undefined&&c.tag!==null)return c.tag;return c.type==='reseller'?'t-suppliers':''}
function effTag(c){const id=tagOf(c);return tagById(id)?id:''}
function tagChip(t){return '<span class="tagchip tc'+(t.color%6)+'">'+esc(t.name)+'</span>'}
function tagDot(t){return '<i class="tdot" style="background:var(--tg'+(t.color%6)+'-fg)"></i>'}
function createTag(name,color){
  name=String(name||'').trim().slice(0,28);
  if(!name)return null;
  const ex=tags().find(t=>t.name.toLowerCase()===name.toLowerCase());
  if(ex)return ex;
  const t={id:uid('t'),name,color:Number.isInteger(color)?((color%6)+6)%6:tags().length%6};
  tags().push(t);
  queueSettings();
  return t;
}

/* ---------- status of a client ---------- */
function info(c){
  const t=todayISO(),soon=Math.max(1,num(state.settings.soonDays)||3);
  const d=diffDays(t,c.expiry);
  let kind,label;
  if(d<0){kind='expired';label=d===-1?'Expired yesterday':'Expired '+(-d)+' days ago'}
  else if(d===0){kind='soon';label='Expires today'}
  else if(d<=soon){kind='soon';label=d===1?'Ends tomorrow':'Ending in '+d+' days'}
  else{kind='active';label=d+' days left'}
  const start=c.start&&c.start<=c.expiry?c.start:addDays(c.expiry,-30);
  const total=Math.max(1,diffDays(start,c.expiry));
  const pct=kind==='expired'?100:Math.max(4,Math.min(100,Math.round(d/total*100)));
  let when;
  if(d<0)when=d===-1?'expired yesterday':'expired '+(-d)+' days ago';
  else if(d===0)when='expires today';
  else if(d===1)when='expires tomorrow';
  else when='expires in '+d+' days';
  return {d,kind,label,pct,when};
}

/* ---------- local mirror and prefs ---------- */
function mirror(){
  if(state.examples)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({clients:state.clients,sales:state.sales,settings:state.settings}))}catch(e){}
}
function readMirror(){
  try{
    const r=localStorage.getItem(LS_KEY);
    if(!r)return null;
    const o=JSON.parse(r);
    return {clients:Array.isArray(o.clients)?o.clients:[],sales:Array.isArray(o.sales)?o.sales:[],settings:o.settings||{}};
  }catch(e){return null}
}
function mergeSettings(s){
  const d={soonDays:3,template:DEFAULT_TPL,lastBackup:null};
  const out=Object.assign(d,s||{});
  out.soonDays=Math.min(30,Math.max(1,Math.round(num(out.soonDays))||3));
  if(!out.template)out.template=DEFAULT_TPL;
  let tg=Array.isArray(s&&s.tags)?s.tags:null;
  if(!tg)tg=DEFAULT_TAGS;
  out.tags=tg.filter(t=>t&&t.name&&/^[A-Za-z0-9_-]{1,60}$/.test(String(t.id))).map(t=>({id:String(t.id),name:String(t.name).slice(0,28),color:((Math.round(num(t.color))%6)+6)%6}));
  state.settings=out;
}
function savePrefs(){try{localStorage.setItem(LS_PREFS,JSON.stringify({sort:ui.sort,group:ui.group}))}catch(e){}}
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(LS_PREFS)||'null');
    if(p){if(['soon','late','name','new','bots'].includes(p.sort))ui.sort=p.sort;ui.group=!!p.group}
  }catch(e){}
}

/* ---------- persistence ---------- */
function clean(o){return JSON.parse(JSON.stringify(o))}
async function cw(fn){
  if(state.examples)return;
  mirror();
  if(!cloud.col||cloud.failed)return;
  try{
    if(!cloud.hasSettings){cloud.hasSettings=true;await cloud.col.doc('settings').set(Object.assign({kind:'settings'},clean(state.settings)))}
    await fn();
  }catch(e){
    console.error(e);
    cloud.failed=true;renderStatus();renderBanners();
    toast('Could not save to your account. Changes are kept in this browser.');
  }
}
const putClient=c=>cw(()=>cloud.col.doc(c.id).set(Object.assign({kind:'client'},clean(c))));
const putSale=s=>cw(()=>cloud.col.doc(s.id).set(Object.assign({kind:'sale'},clean(s))));
const putSettings=()=>cw(()=>cloud.col.doc('settings').set(Object.assign({kind:'settings'},clean(state.settings))));
const delDoc=id=>cw(()=>cloud.col.doc(id).delete());
let settingsChain=Promise.resolve();
function queueSettings(){settingsChain=settingsChain.then(putSettings).catch(()=>{})}

function onSnap(snap){
  const clients=[],sales=[];let settings=null;
  snap.docs.forEach(d=>{
    const x=d.data();if(!x)return;
    if(x.kind==='client'){const c=Object.assign({},x);delete c.kind;c.id=d.id;clients.push(c)}
    else if(x.kind==='sale'){const s=Object.assign({},x);delete s.kind;s.id=d.id;sales.push(s)}
    else if(x.kind==='settings'){settings=Object.assign({},x);delete settings.kind}
  });
  if(snap.empty){
    if(snap.metadata&&snap.metadata.fromCache)return;
    if(cloud.migrating)return;
    const m=readMirror();
    if(m&&(m.clients.length||m.sales.length)){migrate(m);return}
    if(!m){if(!state.examples)loadExamples()}
    else{state.clients=[];state.sales=[];state.examples=false;mergeSettings(m.settings)}
    renderAll();return;
  }
  state.examples=false;
  state.clients=clients;state.sales=sales;
  if(settings){cloud.hasSettings=true;mergeSettings(settings)}
  mirror();
  renderAll();
}
async function migrate(m){
  cloud.migrating=true;
  state.examples=false;state.clients=m.clients;state.sales=m.sales;mergeSettings(m.settings);renderAll();
  try{
    cloud.hasSettings=true;
    await cloud.col.doc('settings').set(Object.assign({kind:'settings'},clean(state.settings)));
    for(const c of m.clients)await cloud.col.doc(c.id).set(Object.assign({kind:'client'},clean(c)));
    for(const s of m.sales)await cloud.col.doc(s.id).set(Object.assign({kind:'sale'},clean(s)));
  }catch(e){console.error(e);cloud.failed=true;renderStatus();renderBanners()}
  cloud.migrating=false;
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,opts){
  const el=$('#toast');opts=opts||{};
  clearTimeout(toastTimer);
  el.classList.remove('out');
  el.innerHTML='<span></span>';
  el.firstChild.textContent=msg;
  if(opts.undo){
    const b=document.createElement('button');b.type='button';b.textContent='Undo';
    b.addEventListener('click',()=>{hideToast();opts.undo()});
    el.appendChild(b);
  }
  el.hidden=false;
  el.style.animation='none';void el.offsetWidth;el.style.animation='';
  toastTimer=setTimeout(hideToast,opts.undo?7000:3600);
}
function hideToast(){
  const el=$('#toast');if(el.hidden)return;
  el.classList.add('out');
  setTimeout(()=>{el.hidden=true;el.classList.remove('out')},200);
}

/* ---------- sheets ---------- */
let lastFocus=null;
function openSheet(title,body){
  closeSheet(true);
  lastFocus=document.activeElement;
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" class="icon-btn" data-close aria-label="Close">'+ICON.close+'</button></div><div id="sheetBody"></div></div>';
  $('#sheetTitle',o).textContent=title;
  $('#sheetBody',o).innerHTML=body;
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))closeSheet()});
  $('#overlayRoot').appendChild(o);
  document.body.classList.add('lock');
  return $('.sheet',o);
}
function closeSheet(instant){
  const o=$('#overlayRoot .overlay');
  if(!o)return;
  document.body.classList.remove('lock');
  const done=()=>{o.remove();if(lastFocus&&lastFocus.focus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}};
  if(instant===true){o.remove();return}
  o.classList.add('out');setTimeout(done,190);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.c-top')){e.preventDefault();e.target.click()}
});

/* ---------- copy ---------- */
async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){ok=false}
  if(ok){
    if(btn){const old=btn.textContent;btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1300)}
    else toast('Copied');
    return;
  }
  const sh=openSheet('Copy this text','<p class="txt">Your browser blocked automatic copying. Select the text below and copy it.</p><textarea id="manualCopy" readonly rows="5"></textarea>');
  const ta=$('#manualCopy',sh);ta.value=text;ta.focus();ta.select();
}
function reminderText(c){
  const i=info(c);
  return (state.settings.template||DEFAULT_TPL)
    .replace(/\{name\}/g,c.name.replace(/\s*\(example\)$/,''))
    .replace(/\{bots\}/g,plural(num(c.bots)||1,'account'))
    .replace(/\{date\}/g,fmtDate(c.expiry))
    .replace(/\{when\}/g,i.when)
    .replace(/\{days\}/g,String(Math.abs(i.d)))
    .replace(/\{rate\}/g,num(c.rate)>0?money(c.rate):'');
}

/* ---------- rendering ---------- */
function setNum(id,val,fmt){
  const el=document.getElementById(id);if(!el)return;
  fmt=fmt||(v=>String(Math.round(v)));
  const from=el._v==null?0:el._v;
  if(from===val){el.textContent=fmt(val);return}
  el._v=val;
  if(reduceMotion()){el.textContent=fmt(val);return}
  const t0=performance.now(),dur=700;
  cancelAnimationFrame(el._raf);
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(val-from)*e);
    if(p<1)el._raf=requestAnimationFrame(step);else el.textContent=fmt(val);
  };
  el._raf=requestAnimationFrame(step);
}

  $('#syncDot').className='dot live '+(cloudOn?'ok':'warn');

  let ending=0,expired=0,bots=0;
  state.clients.forEach(c=>{const i=info(c);if(i.kind==='soon')ending++;if(i.kind==='expired')expired++;else bots+=num(c.bots)||1});

  const sold=state.sales.filter(s=>s.date&&s.date.slice(0,7)===m).reduce((a,s)=>a+num(s.amount),0);
  setNum('stClients',state.clients.length);
  $('#stBots').textContent=plural(bots,'bot')+' running';
  setNum('stSoon',ending);
  $('#stSoonLab').textContent='Ending in '+plural(Math.max(1,num(state.settings.soonDays)||3),'day');
  setNum('stExpired',expired);
  setNum('stSold',sold,v=>money(v));
  $('#stMonth').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}

function visible(){
  const q=ui.q.trim().toLowerCase();
  let a=tagFiltered().map(c=>({c,i:info(c)}));
  if(ui.filter==='active')a=a.filter(x=>x.i.kind!=='expired');
  else if(ui.filter==='soon')a=a.filter(x=>x.i.kind==='soon');
  else if(ui.filter==='expired')a=a.filter(x=>x.i.kind==='expired');
  if(q)a=a.filter(x=>{const t=tagById(effTag(x.c));return [x.c.name,x.c.email,x.c.gameId,x.c.contact,x.c.notes,t?t.name:''].join(' ').toLowerCase().includes(q)});
  const by={
    soon:(p,q)=>p.c.expiry.localeCompare(q.c.expiry)||p.c.name.localeCompare(q.c.name),
    late:(p,q)=>q.c.expiry.localeCompare(p.c.expiry)||p.c.name.localeCompare(q.c.name),
    name:(p,q)=>p.c.name.localeCompare(q.c.name),
    new:(p,q)=>num(q.c.created)-num(p.c.created),
    bots:(p,q)=>(num(q.c.bots)||1)-(num(p.c.bots)||1)||p.c.name.localeCompare(q.c.name)
  };
  a.sort(by[ui.sort]||by.soon);
  return a;
}

/* ---------- actions on clients ---------- */
function findClient(id){return state.clients.find(c=>c.id===id)}
function leaveExamples(){if(state.examples){state.clients=[];state.sales=[];state.examples=false;ui.seen.clear();ui.open.clear()}}
function cardEl(id){return $('#list .card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]')}

async function renew(id,days){
  const c=findClient(id);if(!c)return;
  const prev=clean(c),t=todayISO(),wasExpired=c.expiry<t;
  c.expiry=addDays(wasExpired?t:c.expiry,days);
  if(wasExpired)c.start=t;
  let sale=null;
  if(num(c.rate)>0){
    sale={id:uid('s'),clientId:c.id,name:c.name,date:t,days,amount:Math.round(num(c.rate)*days/30)};
    state.sales.push(sale);
  }
  ui.flash=id;renderAll();
  toast(c.name+' renewed to '+fmtDate(c.expiry)+(sale?' · '+money(sale.amount)+' recorded':''),{undo:async()=>{
    const idx=state.clients.findIndex(x=>x.id===id);
    if(idx>=0)state.clients[idx]=prev;
    if(sale){state.sales=state.sales.filter(s=>s.id!==sale.id)}
    ui.flash=id;renderAll();
    await putClient(prev);
    if(sale)await delDoc(sale.id);
  }});
  await putClient(c);
  if(sale)await putSale(sale);
}
function removeClient(id){
  const c=findClient(id);if(!c)return;
  const el=cardEl(id);
  if(el)el.classList.add('leaving');
  setTimeout(async()=>{
    state.clients=state.clients.filter(x=>x.id!==id);
    ui.shown.delete(id);ui.open.delete(id);ui.picked.delete(id);
    renderAll();
    toast(c.name+' deleted',{undo:async()=>{
      state.clients.push(c);ui.seen.delete(c.id);renderAll();await putClient(c);
    }});
    await delDoc(id);
  },el?220:0);
}
function togglePick(id,card){
  if(ui.picked.has(id))ui.picked.delete(id);else ui.picked.add(id);
  if(card)card.classList.toggle('picked',ui.picked.has(id));
  renderSelbar();
}

async function applyTag(ids,tagId){
  const prev=ids.map(id=>{const c=findClient(id);return c?{id,had:Object.prototype.hasOwnProperty.call(c,'tag'),tag:c.tag}:null}).filter(Boolean);
  if(!prev.length)return;
  leaveExamples();
  prev.forEach(p=>{const c=findClient(p.id);if(c)c.tag=tagId});
  closeSheet();
  if(ui.select){ui.select=false;ui.picked.clear()}
  renderAll();
  const t=tagById(tagId);
  toast(plural(prev.length,'client')+' moved to '+(t?t.name:'No tag'),{undo:async()=>{
    prev.forEach(p=>{const c=findClient(p.id);if(c){if(p.had)c.tag=p.tag;else delete c.tag}});
    renderAll();
    for(const p of prev){const c=findClient(p.id);if(c)await putClient(c)}
  }});
  for(const p of prev){const c=findClient(p.id);if(c)await putClient(c)}
}

/* ---------- Excel ---------- */
function buildWorkbook(){
  const clients=state.clients.map(c=>{const i=info(c),t=tagById(effTag(c));return {
    'Name':c.name,'Tag':t?t.name:'','Bot accounts':num(c.bots)||1,'Email':c.email||'','Password':c.password||'',
    'Game ID':c.gameId||'','Contact':c.contact||'','Rate per 30 days (₹)':num(c.rate)||0,'Start date':fmtDate(c.start),'Expiry date':fmtDate(c.expiry),
    'Days left':i.d,'Status':i.kind==='expired'?'Expired':(i.kind==='soon'?'Ending soon':'Active'),'Notes':c.notes||''
  }});
  const sales=state.sales.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(s=>({
    'Date':fmtDate(s.date),'Client':s.name,'Days':num(s.days),'Amount (₹)':num(s.amount)
  }));
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(clients.length?clients:[{'Name':'','Tag':'','Bot accounts':'','Email':'','Password':'','Game ID':'','Contact':'','Rate per 30 days (₹)':'','Start date':'','Expiry date':'','Days left':'','Status':'','Notes':''}]);
  ws1['!cols']=[22,14,12,30,16,14,18,20,13,13,10,12,34].map(w=>({wch:w}));
  const ws2=XLSX.utils.json_to_sheet(sales.length?sales:[{'Date':'','Client':'','Days':'','Amount (₹)':''}]);
  ws2['!cols']=[13,24,8,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,'Clients');
  XLSX.utils.book_append_sheet(wb,ws2,'Sales');
  return wb;
}
async function downloadExcel(){
  if(typeof XLSX==='undefined'){toast('The Excel library did not load. Check your connection and try again.');return}
  if(!dl){
    try{
      XLSX.writeFile(buildWorkbook(),'Bot-Client-Ledger-'+todayISO()+'.xlsx');
      state.settings.lastBackup=todayISO();
      renderAll();toast('Excel copy downloaded');
      await putSettings();
    }catch(e){console.error(e);toast('Could not download the Excel file. Try again.')}
    return;
  }
  try{
    const buf=XLSX.write(buildWorkbook(),{bookType:'xlsx',type:'array'});
    const r=await dl.save({filename:'Bot-Client-Ledger-'+todayISO()+'.xlsx',data:buf});
    if(r&&(r.status==='saved'||r.status==='delivered')){
      state.settings.lastBackup=todayISO();
      renderAll();toast('Excel copy saved');
      await putSettings();
    }
  }catch(e){
    if(e&&e.code==='declined')return;
    console.error(e);toast('Could not save the Excel file here. Try again.');
  }
}
function parseAnyDate(v){
  if(v===''||v==null)return null;
  if(v instanceof Date&&!isNaN(v))return toISO(v);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ,]+(\d{4})/))){const mi=MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0)return m[3]+'-'+pad(mi+1)+'-'+pad(+m[1])}
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}
function pick(row,keys){
  const ks=Object.keys(row);
  for(const k of keys){
    const f=ks.find(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'').includes(k));
    if(f!==undefined&&row[f]!==''&&row[f]!=null)return row[f];
  }
  return '';
}
function mergeIncoming(inClients,inSales){
  const keyOf=c=>[c.name,c.email,c.gameId].join('|').toLowerCase();
  const byId=new Map(state.clients.map(c=>[c.id,c])),byKey=new Map(state.clients.map(c=>[keyOf(c),c]));
  const added=[],updated=[];
  inClients.forEach(n=>{
    const ex=byId.get(n.id)||byKey.get(keyOf(n));
    if(ex){
      if(String(n.expiry)>String(ex.expiry)){const keep={id:ex.id,created:ex.created};Object.assign(ex,n,keep);updated.push(ex)}
    }else{added.push(n);byId.set(n.id,n);byKey.set(keyOf(n),n)}
  });
  state.clients=state.clients.concat(added);
  const ids=new Set(state.sales.map(s=>s.id)),keys=new Set(state.sales.map(s=>[s.date,s.name,s.amount].join('|')));
  const addedSales=[];
  inSales.forEach(s=>{
    const k=[s.date,s.name,s.amount].join('|');
    if(ids.has(s.id)||keys.has(k))return;
    ids.add(s.id);keys.add(k);addedSales.push(s);
  });
  state.sales=state.sales.concat(addedSales);
  return {added,updated,addedSales};
}
function readExcelRows(wb){
  const t=todayISO();
  const sheetName=wb.SheetNames.find(n=>/client/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:''});
  const salesName=wb.SheetNames.find(n=>/sale/i.test(n));
  const srows=salesName?XLSX.utils.sheet_to_json(wb.Sheets[salesName],{defval:''}):[];
  const seen=new Set(),clients=[],sales=[];
  rows.forEach(r=>{
    const name=String(pick(r,['name'])).trim();
    if(!name)return;
    const email=String(pick(r,['email'])).trim(),game=String(pick(r,['gameid'])).trim();
    const key=[name,email,game].join('|').toLowerCase();
    if(seen.has(key))return;seen.add(key);
    const expiry=parseAnyDate(pick(r,['expir']))||t;
    let start=parseAnyDate(pick(r,['start']));
    if(!start||start>expiry)start=addDays(expiry,-30);
    let tagName=String(pick(r,['tag'])).trim();
    if(!tagName&&/resell/i.test(String(pick(r,['type']))))tagName='Suppliers';
    const tg=tagName?createTag(tagName):null;
    clients.push({id:uid('c'),name,tag:tg?tg.id:'',bots:Math.max(1,Math.round(num(pick(r,['bot'])))||1),email,password:String(pick(r,['password'])),
      gameId:game,contact:String(pick(r,['contact'])).trim(),rate:num(pick(r,['rate']))||'',start,expiry,notes:String(pick(r,['note'])),created:Date.now()});
  });
  srows.forEach(r=>{
    const date=parseAnyDate(pick(r,['date'])),name=String(pick(r,['client'])).trim(),amount=num(pick(r,['amount']));
    if(!date||!name||!amount)return;
    const cl=clients.find(c=>c.name===name)||state.clients.find(c=>c.name===name);
    sales.push({id:uid('s'),clientId:cl?cl.id:'',name,date,days:num(pick(r,['days'])),amount});
  });
  return {clients,sales};
}
async function importFile(file){
  const isJSON=/\.json$/i.test(file.name);
  try{
    let inc;
    if(isJSON){
      const o=JSON.parse(await file.text());
      if(!o||o.app!=='bot-client-ledger'||!Array.isArray(o.clients))throw new Error('not a ledger file');
      const map={};
      const inTags=o.settings&&Array.isArray(o.settings.tags)?o.settings.tags:[];
      inTags.forEach(t=>{if(t&&t.name){const nt=createTag(t.name,Math.round(num(t.color)));if(nt)map[t.id]=nt.id}});
      inc={
        clients:o.clients.filter(c=>c&&c.name&&/^\d{4}-\d{2}-\d{2}$/.test(String(c.expiry))).map(c=>{
          const n=Object.assign({},c,{id:safeId(c.id,'c'),created:c.created||Date.now()});
          if(n.tag!==undefined&&n.tag!==null)n.tag=map[n.tag]||'';
          return n;
        }),
        sales:(Array.isArray(o.sales)?o.sales:[]).filter(s=>s&&s.date&&s.name).map(s=>Object.assign({},s,{id:safeId(s.id,'s')}))
      };
    }else{
      if(typeof XLSX==='undefined'){toast('The Excel library did not load. Check your connection and try again.');return}
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(file)});
      inc=readExcelRows(XLSX.read(data,{type:'array',cellDates:true}));
    }
    if(!inc.clients.length&&!inc.sales.length){toast('No clients found in that file.');return}
    leaveExamples();
    const res=mergeIncoming(inc.clients,inc.sales);
    if(!res.added.length&&!res.updated.length&&!res.addedSales.length){renderAll();toast('Nothing new. Everything in that file is already in your ledger.');return}
    closeSheet();renderAll();
    toast('Imported: '+plural(res.added.length,'new client')+(res.updated.length?', '+res.updated.length+' updated':''));
    queueSettings();
    for(const c of res.added.concat(res.updated))await putClient(c);
    for(const s of res.addedSales)await putSale(s);
  }catch(e){
    console.error(e);toast('Could not read that file. Use a data file or Excel file made by this ledger.');
  }
}
async function exportData(){
  if(state.examples){toast('Add a real client first. Only example clients are showing.');return}
  const payload={app:'bot-client-ledger',version:2,exported:new Date().toISOString(),settings:state.settings,clients:state.clients,sales:state.sales};
  const text=JSON.stringify(payload,null,2),name='Bot-Client-Ledger-data-'+todayISO()+'.json';
  if(dl){
    try{await dl.save({filename:name,data:text});toast('Data file saved')}
    catch(e){if(e&&e.code==='declined')return;console.error(e);toast('Could not save the data file. Try again.')}
    return;
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Data file downloaded');
  }catch(e){console.error(e);toast('Could not download the data file. Try again.')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='toggle'){
    const card=b.closest('.card');if(!card)return;
    if(ui.select){togglePick(id,card);return}
    const open=card.classList.toggle('open');
    if(open)ui.open.add(id);else ui.open.delete(id);
    b.setAttribute('aria-expanded',String(open));
    syncExpandBtn();
  }
  else if(act==='add')openClientForm();
  else if(act==='excel')downloadExcel();
  else if(act==='import')$('#importFile').click();
  else if(act==='export-data')exportData();
  else if(act==='clear-examples'){state.clients=[];state.sales=[];state.examples=false;ui.seen.clear();ui.open.clear();renderAll()}
  else if(act==='renew')renew(id,Number(b.dataset.days));
  else if(act==='edit')openClientForm(id);
  else if(act==='tag')openMoveSheet([id]);
  else if(act==='delete')removeClient(id);
  else if(act==='pw'){if(ui.shown.has(id))ui.shown.delete(id);else ui.shown.add(id);renderList()}
  else if(act==='copy'){const c=findClient(id);if(c&&c[b.dataset.f])copyText(String(c[b.dataset.f]),b)}
  else if(act==='reminder'){const c=findClient(id);if(c)copyText(reminderText(c),null)}
});
$('#btnAdd').addEventListener('click',()=>openClientForm());
$('#btnExcel').addEventListener('click',downloadExcel);
$('#btnSettings').addEventListener('click',openSettings);
$('#btnTags').addEventListener('click',openTagManager);
$('#btnSelect').addEventListener('click',()=>setSelect(!ui.select));
$('#selDone').addEventListener('click',()=>setSelect(false));
$('#selAll').addEventListener('click',()=>{visible().forEach(x=>ui.picked.add(x.c.id));renderList();renderSelbar()});
$('#selMove').addEventListener('click',()=>{if(ui.picked.size)openMoveSheet(Array.from(ui.picked))});
$('#btnExpand').addEventListener('click',()=>{
  const cards=$$('#list .card');
  const all=cards.length&&cards.every(c=>c.classList.contains('open'));
  cards.forEach(c=>{
    c.classList.toggle('open',!all);
    const top=$('.c-top',c);if(top)top.setAttribute('aria-expanded',String(!all));
    if(all)ui.open.delete(c.dataset.id);else ui.open.add(c.dataset.id);
  });
  syncExpandBtn();
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importFile(f)});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;renderList()});
$('#sort').addEventListener('change',e=>{ui.sort=e.target.value;savePrefs();renderList()});
$('#btnGroup').addEventListener('click',()=>{ui.group=!ui.group;savePrefs();$('#btnGroup').setAttribute('aria-pressed',String(ui.group));renderList()});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.fchip');if(!b)return;ui.filter=b.dataset.f;renderFilters();renderList()});
$('#tagbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  if(b.dataset.t==='__manage'){openTagManager();return}
  ui.tag=b.dataset.t;renderTagBar();renderFilters();renderList();
});

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('#themeDay').setAttribute('aria-pressed',String(t==='light'));
  $('#themeNight').setAttribute('aria-pressed',String(t!=='light'));
  try{localStorage.setItem(LS_THEME,t)}catch(e){}
}
$('#themeDay').addEventListener('click',()=>applyTheme('light'));
$('#themeNight').addEventListener('click',()=>applyTheme('dark'));
applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light');

/* ---------- boot ---------- */
loadPrefs();
$('#sort').value=ui.sort;
const m0=readMirror();
if(m0){state.clients=m0.clients;state.sales=m0.sales;mergeSettings(m0.settings)}
else{mergeSettings({});loadExamples()}
renderAll();

setInterval(()=>{if(todayISO()!==ui.day)renderAll()},30000);

(async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const caps=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
    dl=caps[2]||null;
    const db=caps[0],user=caps[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    cloud.uid=id;
    cloud.col=db.collection('data/users/'+id);
    cloud.sub=cloud.col.onSnapshot(onSnap,err=>{console.error(err);cloud.failed=true;renderStatus();renderBanners()});
    renderStatus();renderBanners();
  }catch(e){console.error(e)}
})();
})();
